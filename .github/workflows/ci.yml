# Проверки на каждый PR и push в develop и main (docs/architecture.md, раздел 9).
# content:check, integration, Postgres service и Lighthouse CI добавляются в фичах,
# где они впервые нужны (docs/roadmap.md).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Git-хуки в CI не нужны: те же проверки идут отдельными шагами.
  LEFTHOOK: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-e2e:
    name: build-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Кэш инкрементальной сборки Next.js: https://nextjs.org/docs/app/guides/ci-build-caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Заглушка: пока только smoke-тест; сценарии формы, axe и Lighthouse – в своих фичах.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
