# Проверки на каждый PR и push в develop и main (docs/architecture.md, раздел 9).
# content:check, integration, Postgres service и Lighthouse CI добавляются в фичах,
# где они впервые нужны (docs/roadmap.md).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Новый push в PR отменяет устаревший прогон; прогоны develop и main не отменяются,
# чтобы у каждого слитого коммита был статус CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Git-хуки в CI не нужны: те же проверки идут отдельными шагами.
  LEFTHOOK: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-e2e:
    name: build-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Кэш инкрементальной сборки Next.js: https://nextjs.org/docs/app/guides/ci-build-caching
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Заглушка: пока только smoke-тест; сценарии формы, axe и Lighthouse – в своих фичах.
      - run: pnpm e2e
      # Артефакт публичный, как и репозиторий: в тестах только выдуманные данные (CLAUDE.md, ПД).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Pre-commit хук можно обойти (`--no-verify`), а репозиторий публичный (ADR-015).
  # Сканируется вся история: она маленькая, а секрет мог попасть в любой коммит ветки.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dependabot эту версию не обновляет. Новая версия – вручную: номер и sha256 архива
    # linux_x64 из gitleaks_<версия>_checksums.txt релиза.
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - run: ./gitleaks git --redact --no-banner .

  # Не блокирует слияние: новая уязвимость в зависимости не должна ронять чужие PR.
  # Исправление – отдельным PR (обновление или override).
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level=high
