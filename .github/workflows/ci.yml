# Проверки на каждый PR и push в develop и main (docs/architecture.md, раздел 9).
# content:check, integration, Postgres service и Lighthouse CI добавляются в фичах,
# где они впервые нужны (docs/roadmap.md).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Git-хуки в CI не нужны: те же проверки идут отдельными шагами.
  LEFTHOOK: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
