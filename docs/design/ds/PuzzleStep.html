<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PuzzleUp – деталь-шаг</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;family=Spectral:ital,wght@1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D2340}a:hover{color:#B23A17}
</style>
</helmet>
<div style="{{rootStyle}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 {{w}} {{h}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
<defs><pattern id="stepcell" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#FBFAF5"></rect><path d="M24 0 L0 0 0 24" fill="none" stroke="#3A6FD8" stroke-opacity="0.22" stroke-width="1"></path></pattern></defs>
<path d="{{d}}" fill="{{fill}}" stroke="#F7F4EC" stroke-width="3" stroke-linejoin="round"></path>
</svg>
<div style="{{contentStyle}}">
<div style="font-family: 'Spectral', serif; font-style: italic; font-size: 28px; line-height: 1; color: {{numColor}}">{{n}}</div>
<div style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 20px; line-height: 1.15; letter-spacing: -0.01em; color: {{fg}}">{{title}}</div>
<div style="font-family: 'Golos Text', sans-serif; font-size: 15px; line-height: 1.45; color: {{fg}}">{{text}}</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"text","default":"01"},"title":{"editor":"text","default":"Пробное занятие"},"text":{"editor":"text","default":"30 минут бесплатно. Находим, каких деталей не хватает."},"tone":{"editor":"enum","options":["cell","sand","ink","accent"],"default":"cell"},"left":{"editor":"enum","options":["flat","socket"],"default":"flat"},"right":{"editor":"enum","options":["flat","knob"],"default":"knob"},"w":{"editor":"int","default":280,"min":200,"max":420},"h":{"editor":"int","default":250,"min":180,"max":380},"$preview":{"width":280,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 280, h = this.props.h ?? 250;
    const left = this.props.left || 'flat', right = this.props.right || 'knob';
    const tone = this.props.tone || 'cell';
    const r = 12;
    const f = function (n) { return Math.round(n * 10) / 10; };
    const edge = function (ax, ay, bx, by, nx, ny, kind) {
      const dx = bx - ax, dy = by - ay, k = kind * h;
      const P = function (t, q) { return f(ax + dx * t + nx * k * q) + ',' + f(ay + dy * t + ny * k * q); };
      return ' L' + P(0.4, 0) + ' C' + P(0.378, 0.067) + ' ' + P(0.411, 0.144) + ' ' + P(0.5, 0.144) + ' C' + P(0.589, 0.144) + ' ' + P(0.622, 0.067) + ' ' + P(0.6, 0) + ' L' + bx + ',' + by;
    };
    const rl = left === 'flat' ? r : 0, rr = right === 'flat' ? r : 0;
    let d = 'M' + rl + ',0 L' + (w - rr) + ',0';
    if (rr) d += ' A' + r + ',' + r + ' 0 0 1 ' + w + ',' + r;
    if (right === 'knob') d += edge(w, 0, w, h, 1, 0, 1); else d += ' L' + w + ',' + (h - rr);
    if (rr) d += ' A' + r + ',' + r + ' 0 0 1 ' + (w - r) + ',' + h;
    d += ' L' + rl + ',' + h;
    if (rl) d += ' A' + r + ',' + r + ' 0 0 1 0,' + (h - r);
    if (left === 'socket') d += edge(0, h, 0, 0, -1, 0, -1); else d += ' L0,' + rl;
    if (rl) d += ' A' + r + ',' + r + ' 0 0 1 ' + r + ',0';
    d += ' Z';
    const tones = {
      cell: ['url(#stepcell)', '#1D2340', '#B23A17'],
      sand: ['#E9DFC7', '#1D2340', '#B23A17'],
      ink: ['#1D2340', '#F7F4EC', '#F2A487'],
      accent: ['#C94A24', '#FFFFFF', '#FFFFFF']
    };
    const t = tones[tone] || tones.cell;
    const padL = left === 'socket' ? 56 : 28;
    return {
      rootStyle: 'position: relative; width: ' + w + 'px; height: ' + h + 'px; flex: none',
      contentStyle: 'position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 24px 28px 24px ' + padL + 'px; display: flex; flex-direction: column; justify-content: center; gap: 12px',
      w: w, h: h, d: d, fill: t[0], fg: t[1], numColor: t[2],
      n: this.props.n ?? '01', title: this.props.title ?? '', text: this.props.text ?? ''
    };
  }
}
</script>
</body>
</html>
