<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PuzzleUp – чип</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;family=Spectral:ital,wght@1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D2340}a:hover{color:#B23A17}
</style>
</helmet>
<span style="{{style}}">{{label}}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Математика"},"variant":{"editor":"enum","options":["solid","dashed","outline"],"default":"solid"},"$preview":{"width":140,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'solid';
    const base = 'box-sizing: border-box; display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px; font-family: Golos Text, sans-serif; font-weight: 500; font-size: 14px; white-space: nowrap; ';
    const extra = {
      solid: 'background: #1D2340; color: #F7F4EC;',
      dashed: 'border: 1.5px dashed rgba(29,35,64,0.45); color: #2E3452;',
      outline: 'border: 1px solid rgba(29,35,64,0.25); color: #1D2340; background: #F7F4EC;'
    };
    return { style: base + (extra[v] || extra.solid), label: this.props.label ?? 'Математика' };
  }
}
</script>
</body>
</html>
