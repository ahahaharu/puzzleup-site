<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PuzzleUp – кнопка</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;family=Spectral:ital,wght@1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D2340}a:hover{color:#B23A17}
</style>
</helmet>
<a href="{{href}}" style="{{style}}">{{label}}</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Записаться на пробное занятие"},"variant":{"editor":"enum","options":["primary","secondary","accent","onDark"],"default":"primary"},"size":{"editor":"enum","options":["md","lg"],"default":"lg"},"href":{"editor":"text","default":"#lead"},"$preview":{"width":300,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'primary';
    const big = (this.props.size || 'lg') === 'lg';
    const map = {
      primary: ['#1D2340', '#F7F4EC', 'none'],
      secondary: ['transparent', '#1D2340', '1.5px solid #1D2340'],
      accent: ['#C94A24', '#FFFFFF', 'none'],
      onDark: ['#F7F4EC', '#1D2340', 'none']
    };
    const c = map[v] || map.primary;
    const style = 'box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-height: ' + (big ? 56 : 48) + 'px; padding: 0 ' + (big ? 28 : 22) + 'px; border-radius: 12px; background: ' + c[0] + '; color: ' + c[1] + '; border: ' + c[2] + '; font-family: Golos Text, sans-serif; font-weight: 600; font-size: ' + (big ? 17 : 15) + 'px; text-decoration: none; white-space: nowrap';
    return { style: style, label: this.props.label ?? 'Записаться на пробное занятие', href: this.props.href ?? '#lead' };
  }
}
</script>
</body>
</html>
