# Хуки git. Ставятся автоматически при `pnpm install` (скрипт prepare).
# Вывод – только сводка и ошибки: полный лог каждого хука лишний и в терминале, и у агента.
output:
  - summary
  - failure
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner
    - name: eslint
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    - name: prettier
      glob: '*.{js,mjs,cjs,ts,tsx,json,css,yml,yaml}'
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: content
      glob: 'content/**'
      run: pnpm content:check
    - name: copy
      glob: 'src/**/*.{ts,tsx}'
      run: pnpm lint:copy

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
